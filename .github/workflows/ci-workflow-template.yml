name: Build & Test

on:
  push:

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    name: Frontend Build & Test
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        shell: powershell
        working-directory: ./frontend
        run: |
          Write-Host "Installing frontend dependencies..."

          npm install

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Frontend npm install failed."
            exit 1
          }

      - name: Build frontend
        shell: powershell
        working-directory: ./frontend
        run: |
          Write-Host "Building frontend..."

          npm run build

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Frontend build failed."
            exit 1
          }

      - name: Test frontend
        shell: powershell
        working-directory: ./frontend
        run: |
          Write-Host "Testing frontend..."

          npm test

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Frontend tests failed."
            exit 1
          }


  # ============================================================
  # BACKEND
  # ============================================================

  backend:
    name: Backend Build & Test
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install backend dependencies
        shell: powershell
        working-directory: ./backend
        run: |
          Write-Host "Installing backend dependencies..."

          npm install

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Backend npm install failed."
            exit 1
          }

      - name: Build backend
        shell: powershell
        working-directory: ./backend
        run: |
          Write-Host "Building backend..."

          npm run build

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Backend build failed."
            exit 1
          }

      - name: Test backend
        shell: powershell
        working-directory: ./backend
        run: |
          Write-Host "Testing backend..."

          npm test

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Backend tests failed."
            exit 1
          }
