name: Build & Test

on:
  push:

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: Build & Test
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: powershell
        run: |
          Write-Host "Installing dependencies..."
          npm install

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::npm install failed."
            exit 1
          }

      - name: Build
        shell: powershell
        run: |
          Write-Host "Running build..."
          npm run build

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Build failed."
            exit 1
          }

      - name: Test
        shell: powershell
        run: |
          Write-Host "Running tests..."
          npm test

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Tests failed."
            exit 1
          }

      - name: Success
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "BUILD & TEST PASSED"
          Write-Host "=========================================="
