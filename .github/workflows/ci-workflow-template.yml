name: Build Lint Test

on:
  push:

concurrency:
  group: build-lint-test-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    name: Frontend Build & Lint
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Show frontend npm scripts
        shell: powershell
        working-directory: ./frontend
        run: |
          Write-Host "=========================================="
          Write-Host "Frontend package.json scripts"
          Write-Host "=========================================="

          npm run

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Could not read frontend npm scripts."
            exit 1
          }


      - name: Install frontend dependencies
        shell: powershell
        working-directory: ./frontend
        run: |
          Write-Host "=========================================="
          Write-Host "Installing frontend dependencies"
          Write-Host "=========================================="

          npm install

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Frontend npm install failed."
            exit 1
          }


      - name: Build frontend
        shell: powershell
        working-directory: ./frontend
        run: |
          Write-Host "=========================================="
          Write-Host "Building frontend"
          Write-Host "=========================================="

          npm run build

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Frontend build failed."
            exit 1
          }

          Write-Host "Frontend build passed."


      - name: Lint frontend
        shell: powershell
        working-directory: ./frontend
        run: |
          Write-Host "=========================================="
          Write-Host "Linting frontend"
          Write-Host "=========================================="

          npm run lint

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Frontend lint failed."
            exit 1
          }

          Write-Host "Frontend lint passed."


  # ============================================================
  # BACKEND
  # ============================================================

  backend:
    name: Backend Build & Lint
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Show backend npm scripts
        shell: powershell
        working-directory: ./backend
        run: |
          Write-Host "=========================================="
          Write-Host "Backend package.json scripts"
          Write-Host "=========================================="

          npm run

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Could not read backend npm scripts."
            exit 1
          }


      - name: Install backend dependencies
        shell: powershell
        working-directory: ./backend
        run: |
          Write-Host "=========================================="
          Write-Host "Installing backend dependencies"
          Write-Host "=========================================="

          npm install

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Backend npm install failed."
            exit 1
          }


      - name: Build backend
        shell: powershell
        working-directory: ./backend
        run: |
          Write-Host "=========================================="
          Write-Host "Building backend"
          Write-Host "=========================================="

          npm run build

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Backend build failed."
            exit 1
          }

          Write-Host "Backend build passed."


      - name: Lint backend
        shell: powershell
        working-directory: ./backend
        run: |
          Write-Host "=========================================="
          Write-Host "Linting backend"
          Write-Host "=========================================="

          npm run lint

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Backend lint failed."
            exit 1
          }

          Write-Host "Backend lint passed."


  # ============================================================
  # FINAL RESULT
  # ============================================================

  ci_success:
    name: Build & Lint Passed
    needs:
      - frontend
      - backend
    runs-on: self-hosted

    steps:

      - name: Success
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "BUILD / LINT PASSED"
          Write-Host "=========================================="
          Write-Host "Frontend: PASSED"
          Write-Host "Backend: PASSED"
          Write-Host "=========================================="
